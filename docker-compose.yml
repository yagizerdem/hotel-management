services:
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 1234
    volumes:
      - mongo_data:/data/db

    # Transactions need a replica set. With auth enabled the replica set also
    # needs a keyfile, so generate one before handing over to the image's
    # entrypoint.
    entrypoint:
      - bash
      - -c
      - |
        head -c 756 /dev/urandom | base64 -w 0 > /etc/mongo-keyfile
        chmod 400 /etc/mongo-keyfile
        chown mongodb:mongodb /etc/mongo-keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /etc/mongo-keyfile

    restart: always
    ports:
      # 27018 on the host, so it doesn't clash with other projects' MongoDB on 27017.
      - 27018:27017
    # Initiates the single-node replica set on first run and reports healthy
    # once this node is primary.
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
          "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }
          quit(rs.status().myState === 1 ? 0 : 1)"
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - default

  mongo-express:
    image: mongo-express:latest
    environment:
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_MONGODB_AUTH_USERNAME: "root"
      ME_CONFIG_MONGODB_AUTH_PASSWORD: "1234"

      ME_CONFIG_MONGODB_URL: "mongodb://root:1234@mongodb:27017/?directConnection=true"
      ME_CONFIG_BASICAUTH_ENABLED: true
      ME_CONFIG_BASICAUTH_USERNAME: user
      ME_CONFIG_BASICAUTH_PASSWORD: 1234

      ME_CONFIG_OPTIONS_EDITORTHEME: "default"
      ME_CONFIG_SITE_BASEURL: "/"
    ports:
      - 8081:8081

    networks:
      - default
    depends_on:
      mongodb:
        condition: service_healthy

networks:
  default:
    name: "global"

volumes:
  mongo_data:
